<!doctype html>
<!--
  Not in lila: the comparison page (src/compareMain.ts), for checking how the analysis made on your
  computer compares with Lichess's. The trainer doesn't link to it. Its <head> and header are the
  trainer's (index.html), so lila's stylesheets lay it out the same way.
-->
<html lang="en" class="dark" style="---ui-roundness:7px;---bg-opacity:100;">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, viewport-fit=cover" />
    <title>Lichess's analysis and ours · Mistake Trainer</title>
    <link rel="stylesheet" href="/lila/css/lib.theme.all.css" />
    <link rel="stylesheet" href="/lila/css/site.css" />
    <style>
      @font-face {
        font-family: 'lichess';
        font-display: block;
        src: url('/lila/font/lichess.woff2') format('woff2');
      }
    </style>
  </head>
  <body class="coords-in" data-theme="dark" data-board="brown" data-piece-set="cburnett">
    <header id="top">
      <div class="site-title-nav">
        <div class="site-title">
          <div class="site-name">Mistake Trainer</div>
        </div>
      </div>
      <div class="site-buttons">
        <a class="link" href="/">Back to training</a>
      </div>
    </header>
    <div id="main-wrap" class="is2d">
      <main class="page-small box box-pad mt-compare-page"></main>
    </div>
    <script type="module" src="/src/compareMain.ts"></script>
  </body>
</html>
